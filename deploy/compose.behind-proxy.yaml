# Behind a reverse proxy you already run (nginx, Traefik, another Caddy, ...) that
# holds the domain's HTTPS certificate, on top of compose.yaml. Enable it in .env with
#   COMPOSE_FILE=compose.yaml:compose.behind-proxy.yaml
# (add :compose.sso.yaml before it for GitHub sign-in). Caddy then serves plain HTTP
# on KANZO_HTTP_BIND:KANZO_HTTP_PORT (default 127.0.0.1:8080) and keeps the sign-in;
# your proxy must forward to it with the original Host header and X-Forwarded-For.
# See "Behind your own HTTPS proxy" in the README.
services:
  caddy:
    environment:
      KANZO_SITE: http://${KANZO_DOMAIN}
      KANZO_TLS: none
      # Your proxy reaches Caddy from the Docker bridge or a private network: take the
      # client's address from its X-Forwarded-For.
      KANZO_TRUSTED_PROXIES: private_ranges
    ports: !override
      - "${KANZO_HTTP_BIND:-127.0.0.1}:${KANZO_HTTP_PORT:-8080}:80"
